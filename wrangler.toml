# Remote MCP server that lets AI assistants (ChatGPT, Claude) search my
# trusted sources: the curated feeds in rss-reader and my own blog/portfolio.
name = "knowledge-mcp"
main = "src/index.ts"

# The Workers runtime gates breaking changes behind this date. Bumping it is a
# deliberate opt-in to newer semantics.
compatibility_date = "2026-09-25"

# Refresh the index every 30 minutes (each run refreshes a slice of the
# feeds). Locally: `pnpm dev --test-scheduled`, then
# `curl localhost:8787/__scheduled`.
[triggers]
crons = ["*/30 * * * *"]

[vars]
PORTFOLIO_CONTENT_URL = "https://serabin1.github.io/content.json"
PORTFOLIO_HOST = "serabin1.github.io"
CURATED_OPML_URL = "https://my-rss-reader.pages.dev/curated-feeds.opml"

# Documents, chunks and the FTS5 keyword index. Created with `wrangler d1
# create knowledge-mcp`. The id is an identifier, not a secret, and is meant
# to be committed. Local dev uses a Miniflare sqlite under .wrangler/, named
# after this id; `pnpm d1:migrate` creates the tables there.
[[d1_databases]]
binding = "DB"
database_name = "knowledge-mcp"
database_id = "711f0a15-dc10-4234-9644-d455944a2b1f"
migrations_dir = "migrations"

# Semantic search: Workers AI makes the embeddings, Vectorize stores and
# searches them. The index was created with
#   wrangler vectorize create knowledge-mcp --dimensions=768 --metric=cosine
# and must match the embedding model in src/search/embed.ts. Neither has a
# local emulator: in `wrangler dev` they call the real account, and without
# a login search falls back to keyword-only.
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "knowledge-mcp"
