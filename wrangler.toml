# Remote MCP server that lets AI assistants (ChatGPT, Claude) search my
# trusted sources: the curated feeds in rss-reader and my own blog/portfolio.
name = "knowledge-mcp"
main = "src/index.ts"

# The Workers runtime gates breaking changes behind this date. Bumping it is a
# deliberate opt-in to newer semantics.
compatibility_date = "2026-09-25"

# Refresh the index every 30 minutes (each run refreshes a slice of the feeds). Locally: `pnpm dev --test-scheduled`, then
# `curl localhost:8787/__scheduled`.
[triggers]
crons = ["*/30 * * * *"]

[vars]
PORTFOLIO_CONTENT_URL = "https://serabin1.github.io/content.json"
PORTFOLIO_HOST = "serabin1.github.io"
CURATED_OPML_URL = "https://my-rss-reader.pages.dev/curated-feeds.opml"

# Documents, chunks and the FTS5 keyword index. Local dev uses a Miniflare
# sqlite under .wrangler/; `pnpm d1:migrate` creates the tables there.
[[d1_databases]]
binding = "DB"
database_name = "knowledge-mcp"
database_id = "local-only-until-first-deploy"
migrations_dir = "migrations"

# Semantic search: Workers AI makes the embeddings, Vectorize stores and
# searches them. Neither has a local emulator (in `wrangler dev` they call
# your Cloudflare account), so they're off until deploy and search runs
# keyword-only. To enable:
#   wrangler vectorize create knowledge-mcp --dimensions=768 --metric=cosine
# then uncomment both blocks. The next cron runs backfill every chunk.
# [ai]
# binding = "AI"
#
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "knowledge-mcp"
